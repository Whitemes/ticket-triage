# Profile "persist" (--spring.profiles.active=persist): tickets are kept across restarts.
# H2 in file mode, stored in ./data/ticketdb relative to the working directory; the schema is updated, never dropped.
# WRITE_DELAY=0 writes each commit to disk at once, so a ticket survives even if the process is killed.
# Without this profile the default configuration (application.properties) stays in memory.
spring.datasource.url=jdbc:h2:file:./data/ticketdb;WRITE_DELAY=0
spring.jpa.hibernate.ddl-auto=update
