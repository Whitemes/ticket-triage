<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Tri de tickets IT</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        textarea { width: 100%; height: 8rem; }
        button { margin-top: 0.5rem; padding: 0.5rem 1.5rem; }
        nav a { margin-right: 1rem; }
    </style>
</head>
<body>
<nav>
    <a href="/">Soumettre un ticket</a>
    <a href="/human-queue">File humaine</a>
</nav>
<hr/>
<h1>Soumettre un ticket de support</h1>
<form id="ticket-form" th:action="@{/tickets}" method="post"
      onsubmit="this.querySelector('button').disabled = true; document.getElementById('attente').hidden = false;">
    <label for="rawText"><strong>Description du problème :</strong></label><br/>
    <textarea id="rawText" name="rawText" required placeholder="Décrivez votre problème…"></textarea><br/>
    <button type="submit">Envoyer</button>
    <p id="attente" hidden>Classification en cours…</p>
</form>
<script>
    // Back/forward cache restores the page as it was left: re-enable the form.
    window.addEventListener('pageshow', function () {
        document.querySelector('#ticket-form button').disabled = false;
        document.getElementById('attente').hidden = true;
    });
</script>
</body>
</html>
