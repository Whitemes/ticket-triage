# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:ticketdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Classifier selection (fake | granite)
classifier.type=fake

# Confidence threshold: tickets below this score go to the human queue
classifier.confidence-threshold=0.7

# Maximum length of a ticket (characters): blank or longer tickets are refused on the form
ticket.max-length=5000

# Ollama configuration (used only when classifier.type=granite)
ollama.base-url=http://localhost:11434
ollama.model-name=granite4:micro
ollama.timeout-seconds=60

# Logging: quiet framework, triage flow visible as [TRIAGE] lines (masked text only, never the original)
logging.level.root=WARN
logging.level.dev.whitemes.tickettriage=INFO
